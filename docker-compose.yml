services:
  app:
    build: .
    ports:
      - "8080:8080"
      # Online coordinator (game NAT traversal): TCP signaling + UDP STUN.
      # Must be published directly (not via the HTTP reverse proxy).
      - "27500:27500"
      - "27501:27501/udp"
    environment:
      - STATS_DIR=/app/stats
      - MAPS_DIR=/app/maps
      - LOGS_DIR=/app/logs
    volumes:
      - stats_data:/app/stats
      - maps_data:/app/maps
      - logs_data:/app/logs

volumes:
  stats_data:
  maps_data:
  logs_data:
